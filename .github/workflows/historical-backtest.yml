name: Historical Game Score Backtest

on:
  # Automatically run the backtest on main whenever the scoring/backtest code changes.
  push:
    branches:
      - main
    paths:
      - 'scripts/historical-backtest.mjs'
      - 'src/sports/game-score.js'
      - 'src/sports/historical-calibration.js'
      - '.github/workflows/historical-backtest.yml'
  # Keep manual dispatch available for custom year ranges when needed.
  workflow_dispatch:
    inputs:
      start_year:
        description: First calendar year to include
        required: false
        default: '2021'
      end_year:
        description: Last calendar year to include
        required: false
        default: '2025'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKTEST_START_YEAR: ${{ inputs.start_year || '2021' }}
      BACKTEST_END_YEAR: ${{ inputs.end_year || '2025' }}
      BACKTEST_REQUEST_DELAY_MS: '75'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run historical backtest
        run: node scripts/historical-backtest.mjs
      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: historical-game-score-backtest-${{ env.BACKTEST_START_YEAR }}-${{ env.BACKTEST_END_YEAR }}
          path: artifacts/historical-backtest/
          retention-days: 30
